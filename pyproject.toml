[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-compute-trends"
version = "0.1.0"
description = "SQL and Python analysis of Epoch AI's notable AI models: compute growth, sectors and openness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tavia" }]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.scripts]
ai-compute-trends = "ai_compute_trends.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
