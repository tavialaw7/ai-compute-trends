name: Checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate outputs from the committed data
        run: |
          ai-compute-trends --out /tmp/out --docs /tmp/docs
          test -s /tmp/out/findings.json
          test -s /tmp/out/tableau/models_clean.csv
          test -s /tmp/docs/index.html
